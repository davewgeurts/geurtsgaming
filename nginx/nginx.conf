events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	upstream client {
		server 172.37.0.2:4321;
	}

	upstream api {
		server 172.37.0.3:4322;
	}

	upstream relay {
		server 172.37.0.5:4323;
	}

	server {
		listen 80;
		server_name geurtsgaming.localdev localhost _;

		# Presence & Top 10 Pilots Leaderboard Lambda container
		location /api/ {
			proxy_pass http://api/;
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header Origin $http_origin;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Real-time Co-op Room WebSocket Relay container (Durable Object local equivalent)
		location /relay/ {
			proxy_pass http://relay/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $http_host;
			proxy_set_header Origin $http_origin;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_buffering off;
			tcp_nodelay on;
			proxy_read_timeout 7200s;
			proxy_send_timeout 7200s;
		}

		# Astro client & Vite HMR WebSocket
		location / {
			proxy_pass http://client;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_read_timeout 86400;
		}
	}
}
