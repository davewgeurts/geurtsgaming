networks:
  gg-network:
    ipam:
      config:
        - subnet: 172.37.0.0/16

services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geurtsgaming-client
    networks:
      gg-network:
        ipv4_address: 172.37.0.2
    ports:
      - "4321:4321"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./tests:/app/tests
      - ./astro.config.mjs:/app/astro.config.mjs
      - ./tsconfig.json:/app/tsconfig.json
    environment:
      - NODE_ENV=development
      - ASTRO_TELEMETRY_DISABLED=1
      - PUBLIC_API_URL=http://localhost:4322
    stdin_open: true
    tty: true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geurtsgaming-api
    command: ["node", "--watch", "lambda/dev-server.mjs"]
    networks:
      gg-network:
        ipv4_address: 172.37.0.3
    ports:
      - "4322:4322"
    volumes:
      - ./lambda:/app/lambda
    environment:
      - NODE_ENV=development
      - PORT=4322
      - DEFAULT_SITE=geurtsgaming
    stdin_open: true
    tty: true

  nginx:
    image: nginx:alpine
    container_name: geurtsgaming-nginx
    ports:
      - "84:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - api
    networks:
      gg-network:
        ipv4_address: 172.37.0.4
