name: Deploy Co-op Relay

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Cloudflare Worker environment (deploy staging first, then production)'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-relay.yml'

permissions:
  contents: read

concurrency:
  group: relay-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify relay unit & hibernation tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run relay test suite
        run: node --disable-warning=ExperimentalWarning --experimental-transform-types --import ./tests/ts-resolve.mjs --test tests/relay.test.ts

  deploy:
    name: Deploy Worker (${{ inputs.environment || 'production' }})
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare token availability
        id: creds
        env:
          CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$CF_TOKEN_SET" != "true" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::CLOUDFLARE_API_TOKEN secret is not set in GitHub repository secrets yet."
              exit 1
            fi
            echo "Skipping automatic relay deploy on push because CLOUDFLARE_API_TOKEN is not configured yet." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Set up Node 24
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler 4 in isolated prefix
        if: steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler"
          npm --prefix "$RUNNER_TEMP/wrangler" install --no-audit --no-fund wrangler@4
          echo "$RUNNER_TEMP/wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Deploy Co-op Relay Worker & Durable Object
        if: steps.creds.outputs.ready == 'true'
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          if [ -n "$CF_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          fi
          if [ "$TARGET_ENV" = "staging" ]; then
            wrangler deploy --env staging
          else
            wrangler deploy --env=""
          fi

      - name: Sync ORIGIN_SECRET if configured in GitHub Secrets
        if: steps.creds.outputs.ready == 'true'
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_ORIGIN_SECRET: ${{ secrets.RELAY_ORIGIN_SECRET }}
          WRANGLER_SEND_METRICS: 'false'
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          if [ -n "$CF_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          fi
          if [ -n "$RELAY_ORIGIN_SECRET" ]; then
            if [ "$TARGET_ENV" = "staging" ]; then
              printf '%s' "$RELAY_ORIGIN_SECRET" | wrangler secret put ORIGIN_SECRET --env staging
            else
              printf '%s' "$RELAY_ORIGIN_SECRET" | wrangler secret put ORIGIN_SECRET --env=""
            fi
          fi
