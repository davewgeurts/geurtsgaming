name = "gg-relay"
main = "worker.mjs"
compatibility_date = "2026-11-01"

[vars]
RELAY_ENV = "production"

[[durable_objects.bindings]]
name = "COOP_ROOMS"
class_name = "CoopRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CoopRoomDO"]

[env.staging]
name = "gg-relay-staging"

[env.staging.vars]
RELAY_ENV = "staging"

[[env.staging.durable_objects.bindings]]
name = "COOP_ROOMS"
class_name = "CoopRoomDO"
